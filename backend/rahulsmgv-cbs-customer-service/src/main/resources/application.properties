# PostgreSQL datasource configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/cbs
# PostgreSQL username
spring.datasource.username=cbs_user
# PostgreSQL password
spring.datasource.password=cbs_password
# PostgreSQL JDBC driver
spring.datasource.driver-class-name=org.postgresql.Driver
# Hibernate schema management
spring.jpa.hibernate.ddl-auto=update
# Keep SQL out of application logs by default. Enable explicitly when debugging.
spring.jpa.show-sql=false
spring.sql.init.mode=always
# PostgreSQL dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging configuration
logging.level.com.rahulsmgv.cbs.customer=INFO