version: "3.9"

services:

  postgres:
    image: postgres:15
    container_name: cbs-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cbs-network


  redis:
    image: redis:7
    container_name: cbs-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - cbs-network


  kafka:
    image: confluentinc/cp-kafka:7.3.3
    container_name: cbs-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:

      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_ADVERTISED_LISTENERS:
        PLAINTEXT://localhost:9092

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    depends_on:
      - zookeeper

    networks:
      - cbs-network


  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: cbs-zookeeper

    environment:

      ZOOKEEPER_CLIENT_PORT: 2181

    ports:

      - "2181:2181"

    networks:
      - cbs-network


  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: cbs-keycloak

    command:
      - start-dev

    environment:

      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}

      KEYCLOAK_ADMIN_PASSWORD:
        ${KEYCLOAK_ADMIN_PASSWORD}

    ports:

      - "8080:8080"

    networks:
      - cbs-network



  minio:
    image: minio/minio:latest

    container_name: cbs-minio

    command:
      server /data --console-address ":9001"

    environment:

      MINIO_ROOT_USER:
        ${MINIO_ROOT_USER}

      MINIO_ROOT_PASSWORD:
        ${MINIO_ROOT_PASSWORD}

    ports:

      - "9000:9000"

      - "9001:9001"

    volumes:

      - minio_data:/data

    networks:

      - cbs-network



  prometheus:

    image: prom/prometheus:latest

    container_name: cbs-prometheus

    ports:

      - "9090:9090"

    volumes:

      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:Z

    networks:

      - cbs-network



  grafana:

    image: grafana/grafana:latest

    container_name: cbs-grafana

    ports:

      - "3000:3000"

    depends_on:

      - prometheus

    networks:

      - cbs-network



volumes:

  postgres_data:

  minio_data:


networks:

  cbs-network:

    driver: bridge
